  for(i=start;i<=end;i++){var k=viewY+'-'+pad(viewM+1)+'-'+pad(i), av=!!byDay[k], c='d'+(av?' av':'')+(k===today?' today':'');
    h+='<button type="button" class="'+c+'" data-k="'+k+'" '+(av?'aria-pressed="'+(k===selDay)+'" aria-label="'+longDay(k)+', '+t('slotsN')(byDay[k].length)+'"':'disabled aria-label="'+longDay(k)+', '+t('noSlots')+'"')+'>'+i+'</button>'}
  cal.innerHTML=h+'</div></div>';
  $('prev').onclick=function(){viewM--;if(viewM<0){viewM=11;viewY--}renderCal()};
  $('next').onclick=function(){viewM++;if(viewM>11){viewM=0;viewY++}renderCal()};
  [].forEach.call(cal.querySelectorAll('.d.av'),function(b){b.onclick=function(){pickDay(b.getAttribute('data-k'),false,true)}});
}
function pickText(k,s){return t('picked')+longDay(k)+' · '+hour(s)+' ('+t('limaTime')+')'+(myTz!==LIMA?' · '+mine(s)+' '+t('inYourZone'):'')}
function pickDay(k,keepTime,focusIt){
  selDay=k; if(!keepTime){chosen=null;$('pick').className='pick hide'} renderCal();
  var box=$('times'), slots=byDay[k]; box.className='times';
  var am=slots.filter(function(s){return +hour(s.start).slice(0,2)<12}), pm=slots.filter(function(s){return +hour(s.start).slice(0,2)>=12});
  box.innerHTML='<h3 tabindex="-1" id="th"></h3><div id="tm"></div>'; $('th').textContent=t('freeOn')+longDay(k);
  function grp(name,arr){if(!arr.length)return;var h4=document.createElement('h4');h4.textContent=name;var w=document.createElement('div');w.className='slots';w.setAttribute('role','group');w.setAttribute('aria-label',name+' · '+longDay(k));
    arr.forEach(function(s){var b=document.createElement('button');b.type='button';b.className='slot';b.setAttribute('aria-pressed',String(chosen===s.start));
      b.innerHTML=hour(s.start)+(myTz!==LIMA?'<small>'+mine(s.start)+' '+t('yourTime')+'</small>':'');b.setAttribute('aria-label',hour(s.start)+' '+t('limaTime')+', '+longDay(k));
      b.onclick=function(){[].forEach.call(box.querySelectorAll('.slot'),function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');chosen=s.start;
        var p=$('pick');p.className='pick';p.textContent=pickText(k,s.start);$('miss').className='msg err hide';
        if($('nombre').getBoundingClientRect().top>innerHeight*0.85)$('nombre').scrollIntoView({behavior:'smooth',block:'center'})};
      w.appendChild(b)});
    var tm=$('tm');tm.appendChild(h4);tm.appendChild(w)}
  grp(t('am'),am);grp(t('pm'),pm);
  if(chosen){$('pick').textContent=pickText(k,chosen)}
  if(focusIt){$('th').focus({preventScroll:true});if($('th').getBoundingClientRect().bottom>innerHeight)$('th').scrollIntoView({behavior:'smooth',block:'center'})}
}
function renderFirst(){if(!days.length)return;var fp=$('first');fp.className='first';fp.innerHTML=t('first')+'<button type="button" id="gofirst"></button>';
  $('gofirst').textContent=longDay(days[0])+' · '+hour(byDay[days[0]][0].start);
  $('gofirst').onclick=function(){pickDay(days[0],false,false);var b=document.querySelector('#times .slot');if(b)b.click()}}
function loadAvail(keepSel){
  $('cal').innerHTML='<div class="skel" role="status"></div>';
  var ac=new AbortController(), to=setTimeout(function(){ac.abort()},12000);
  return fetch(C.api+'/api/availability',{signal:ac.signal}).then(function(r){clearTimeout(to);if(!r.ok)throw new Error('http');return r.json()}).then(function(j){
    if(j.mode==='error')throw new Error('mode');
    byDay={};days=[];availOK=true;
    if(!j.slots||!j.slots.length){availOK=false;$('first').className='first hide';$('times').className='times hide';$('cal').innerHTML='<p class="msg">'+t('empty')+'</p>';return}
    j.slots.forEach(function(s){var k=iso(s.start);(byDay[k]=byDay[k]||[]).push(s)}); days=Object.keys(byDay).sort();
    var f=days[0].split('-'); viewY=+f[0]; viewM=+f[1]-1;
    if(keepSel&&selDay&&byDay[selDay]){var g=selDay.split('-');viewY=+g[0];viewM=+g[1]-1;pickDay(selDay,false,false)}else{selDay=null;chosen=null;$('times').className='times hide';$('pick').className='pick hide';renderCal()}
    renderFirst();
  }).catch(function(){clearTimeout(to);availOK=false;$('first').className='first hide';$('cal').innerHTML='<p class="msg err" role="alert">'+t('loadErr')+'<button type="button" class="linkbtn" id="retry">'+t('retry')+'</button>'+t('orWrite')+'<a href="mailto:'+MAIL+'">'+MAIL+'</a>.</p>';$('retry').onclick=function(){loadAvail(false)}});
}
function tsFail(){tsFailed=true;tsToken=null;$('ts').innerHTML='<p class="help">'+t('tsFail')+'<a href="mailto:'+MAIL+'">'+MAIL+'</a>.</p>'}
function ics(startIso,meet){var s=new Date(startIso),e=new Date(s.getTime()+30*60000);function f(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//analizodatos.com//agendar//ES','BEGIN:VEVENT','UID:'+f(s)+'@analizodatos.com','DTSTAMP:'+f(new Date()),'DTSTART:'+f(s),'DTEND:'+f(e),'SUMMARY:'+t('icsT'),'DESCRIPTION:'+(meet?'Google Meet: '+meet:t('icsD')),'END:VEVENT','END:VCALENDAR'].join('\r\n'))}
applyStatic();
if(ctx){$('nota').value=((lang==='en'?'Conversation with Manubot: ':'Conversación con Manubot: ')+ctx).slice(0,300);$('nota').closest('details').open=true}
loadAvail(false);
var sc=document.createElement('script');sc.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';sc.async=true;
sc.onload=function(){try{window.turnstile.render('#ts',{sitekey:C.turnstileSiteKey,size:'flexible',callback:function(tk){tsToken=tk;tsFailed=false;$('miss').className='msg err hide'},'expired-callback':function(){tsToken=null},'error-callback':tsFail})}catch(e){tsFail()}};
sc.onerror=tsFail;document.head.appendChild(sc);
setTimeout(function(){if(!tsToken&&!window.turnstile)tsFail()},9000);
$('f').addEventListener('submit',function(ev){ev.preventDefault(); if(done)return;
  var out=$('out'),btn=$('go'),miss=setStatus();
  if(miss.length){var m=$('miss');m.className='msg err';m.textContent=t('miss')+miss.join(', ')+'.';
    if($('nombre').value.trim().length<2)$('nombre').setAttribute('aria-invalid','true');if(!/.+@.+\..+/.test($('correo').value))$('correo').setAttribute('aria-invalid','true');
    if(!chosen)$('s2').scrollIntoView({behavior:'smooth',block:'start'});else if($('nombre').getAttribute('aria-invalid')==='true')$('nombre').focus();else if($('correo').getAttribute('aria-invalid')==='true')$('correo').focus();return}
  btn.disabled=true;out.className='';out.textContent=t('booking');
  var intent=[$('tema').value,$('tam').value,$('plazo').value,$('empresa').value.trim()?('Empresa/LinkedIn: '+$('empresa').value.trim()):'',$('nota').value.trim()].filter(Boolean).join(' | ');
  var ac=new AbortController(),to=setTimeout(function(){ac.abort()},20000);
  fetch(C.api+'/api/bookings',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('nombre').value.trim(),email:$('correo').value.trim(),start:chosen,consent:true,turnstile:tsToken,intent:intent})})
  .then(function(r){clearTimeout(to);return r.json().catch(function(){return{}}).then(function(j){return{ok:r.ok,status:r.status,j:j}})}).then(function(x){
    if(!x.ok){var msg=(lang==='es'&&x.j.error)||t('generic');
      if(x.status===409&&/horario|slot/i.test(x.j.error||'')){msg=t('taken');chosen=null;loadAvail(true)}
      if(x.status===502)msg=t('e502');
      out.className='msg err';out.setAttribute('role','alert');out.textContent=msg;btn.disabled=false;if(window.turnstile){try{window.turnstile.reset()}catch(e){}tsToken=null}return}
    done=true;$('f').querySelectorAll('input,select,textarea,button').forEach(function(e){e.disabled=true});btn.className='go hide';$('miss').className='msg err hide';
    var k=iso(x.j.start);out.className='msg ok';out.setAttribute('role','status');out.innerHTML='';
    var p=document.createElement('p');p.innerHTML='<b>'+t('okT')+'</b> ';p.appendChild(document.createTextNode(longDay(k)+t('okA')+hour(x.j.start)+' ('+t('limaTime')+')'+(myTz!==LIMA?' · '+mine(x.j.start)+' '+t('inYourZone'):'')+t('okB')+$('correo').value.trim()+t('okC')));out.appendChild(p);
    var acts=document.createElement('div');acts.className='acts';
    if(x.j.meetLink&&/^https:\/\//.test(x.j.meetLink)){var a=document.createElement('a');a.className='main';a.href=x.j.meetLink;a.target='_blank';a.rel='noopener';a.textContent=t('meet');acts.appendChild(a)}
    var cal=document.createElement('a');cal.href=ics(x.j.start,x.j.meetLink);cal.download='llamada-manuel-arguelles.ics';cal.textContent=t('addCal');acts.appendChild(cal);
    if(x.j.cancelUrl&&/^https:\/\//.test(x.j.cancelUrl)){var c=document.createElement('a');c.href=x.j.cancelUrl;c.textContent=t('cancel');acts.appendChild(c)}
    out.appendChild(acts);var h=document.createElement('p');h.className='help';h.textContent=t('saveHelp');out.appendChild(h);out.focus();out.scrollIntoView({behavior:'smooth',block:'center'});
  }).catch(function(){clearTimeout(to);out.className='msg err';out.setAttribute('role','alert');out.textContent=t('net');btn.disabled=false});
});
})();
